          type: array
          items:
            $ref: "#/components/schemas/Response"
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    PublicForm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        form_version_id:
          type: string
          format: uuid
        version_number:
          type: integer
        flow_definition: {}
        theme: {}
        settings: {}

    # ─── Event Types ──────────────────────────────────────
    EventType:
      type: object
      properties:
        id:
          type: string
          format: uuid
